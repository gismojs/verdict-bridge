<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdict Bridge</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2d3148;
      --text: #e2e8f0; --muted: #718096; --accent: #6c63ff;
      --green: #48bb78; --red: #fc8181; --yellow: #f6e05e; --blue: #63b3ed;
      --radius: 6px; --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border);
             padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    header h1 { font-size: 1rem; font-weight: 700; letter-spacing: .03em; color: var(--accent); }
    #agent-badge { font-size: .75rem; padding: 2px 10px; border-radius: 999px;
                   background: var(--border); color: var(--muted); }
    #agent-badge.connected { background: #1a3a2a; color: var(--green); }
    #refresh-btn { margin-left: auto; font-size: .8rem; padding: 4px 14px; border-radius: var(--radius);
                   background: var(--accent); color: #fff; border: none; cursor: pointer; }
    #refresh-btn:hover { opacity: .85; }

    /* Token setup */
    #setup { flex: 1; display: flex; align-items: center; justify-content: center; }
    #setup-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                  padding: 32px; width: 380px; display: flex; flex-direction: column; gap: 12px; }
    #setup-card h2 { font-size: 1rem; color: var(--text); }
    #setup-card p  { font-size: .82rem; color: var(--muted); }
    #setup-card input { width: 100%; background: var(--bg); border: 1px solid var(--border);
                        border-radius: var(--radius); padding: 8px 12px; color: var(--text);
                        font-family: var(--mono); font-size: .82rem; }
    #setup-card input:focus { outline: none; border-color: var(--accent); }
    #setup-card button { background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
                         padding: 9px; cursor: pointer; font-size: .85rem; }
    #setup-card button:hover { opacity: .85; }
    #setup-error { color: var(--red); font-size: .78rem; display: none; }

    /* Main layout */
    #main { flex: 1; display: none; overflow: hidden; }
    .layout { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
    .sidebar { background: var(--surface); border-right: 1px solid var(--border);
               display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 10px; font-size: .78rem; text-align: center; cursor: pointer;
               border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .message-list { flex: 1; overflow-y: auto; }
    .msg-item { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
                transition: background .1s; }
    .msg-item:hover { background: rgba(108,99,255,.06); }
    .msg-item.selected { background: rgba(108,99,255,.12); }
    .msg-item.unread .msg-subject { font-weight: 700; }
    .msg-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .msg-subject { font-size: .84rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-preview { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kind-badge { font-size: .68rem; padding: 1px 7px; border-radius: 999px; flex-shrink: 0; }
    .kind-finding    { background: #3a1a1a; color: var(--red); }
    .kind-fix_ready  { background: #1a2a3a; color: var(--blue); }
    .kind-test_result { background: #1a3a2a; color: var(--green); }
    .kind-ready_for_test { background: #2a2a1a; color: var(--yellow); }
    .kind-note, .kind-question, .kind-answer { background: var(--border); color: var(--muted); }
    .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

    /* Detail pane */
    .detail { display: flex; flex-direction: column; overflow: hidden; }
    .detail-header { padding: 16px 20px; border-bottom: 1px solid var(--border);
                     background: var(--surface); flex-shrink: 0; }
    .detail-header h2 { font-size: .95rem; margin-bottom: 6px; }
    .detail-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: .75rem; color: var(--muted); }
    .detail-meta span { display: flex; align-items: center; gap: 4px; }
    .detail-actions { padding: 10px 20px; border-bottom: 1px solid var(--border);
                      background: var(--surface); display: flex; gap: 8px; flex-shrink: 0; }
    .btn-sm { font-size: .78rem; padding: 4px 14px; border-radius: var(--radius);
              border: 1px solid var(--border); background: var(--bg); color: var(--text);
              cursor: pointer; }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .85; color: #fff; }
    .detail-body { flex: 1; overflow-y: auto; padding: 20px; }
    .body-text { white-space: pre-wrap; font-family: var(--mono); font-size: .82rem;
                 color: var(--text); line-height: 1.6; }
    .body-json { background: var(--surface); border: 1px solid var(--border);
                 border-radius: var(--radius); padding: 16px; }
    .json-section { margin-bottom: 16px; }
    .json-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
                  color: var(--muted); margin-bottom: 6px; }
    .json-value { font-family: var(--mono); font-size: .8rem; }
    .verdict-accepted   { color: var(--green); }
    .verdict-needs_changes { color: var(--red); }
    .verdict-ready_for_independent_test { color: var(--blue); }
    .verdict-progress   { color: var(--yellow); }
    .check-passed { color: var(--green); }
    .check-failed { color: var(--red); }
    .check-blocked, .check-not_run { color: var(--muted); }
    .finding-tag { display: inline-block; background: var(--border); border-radius: 999px;
                   padding: 1px 8px; font-size: .74rem; margin: 2px; }
    .sha { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
    .empty-state { flex: 1; display: flex; align-items: center; justify-content: center;
                   color: var(--muted); font-size: .88rem; }

    /* Tasks tab */
    .task-item { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .task-id { font-family: var(--mono); font-size: .78rem; color: var(--accent); margin-bottom: 3px; }
    .task-meta { font-size: .74rem; color: var(--muted); display: flex; gap: 10px; }
    .status-badge { font-size: .68rem; padding: 1px 8px; border-radius: 999px; }
    .status-pending  { background: #2a2a1a; color: var(--yellow); }
    .status-running  { background: #1a2a3a; color: var(--blue); }
    .status-waiting  { background: var(--border); color: var(--muted); }
    .status-complete { background: #1a3a2a; color: var(--green); }

    /* Compose */
    #compose-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
                       z-index: 100; align-items: center; justify-content: center; }
    #compose-overlay.open { display: flex; }
    #compose-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
                    padding: 24px; width: 520px; max-height: 80vh; overflow-y: auto;
                    display: flex; flex-direction: column; gap: 12px; }
    #compose-card h2 { font-size: .95rem; }
    .field-row { display: flex; flex-direction: column; gap: 4px; }
    .field-row label { font-size: .76rem; color: var(--muted); }
    .field-row select, .field-row input, .field-row textarea {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 7px 10px; color: var(--text); font-size: .83rem; font-family: inherit; }
    .field-row textarea { min-height: 100px; resize: vertical; font-family: var(--mono); }
    .field-row select:focus, .field-row input:focus, .field-row textarea:focus {
      outline: none; border-color: var(--accent); }
    .compose-actions { display: flex; gap: 8px; justify-content: flex-end; }

    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>⚖ Verdict Bridge</h1>
  <span id="agent-badge">not connected</span>
  <button id="refresh-btn" onclick="refresh()">↻ Refresh</button>
</header>

<!-- Token setup -->
<div id="setup">
  <div id="setup-card">
    <h2>Connect to Bridge</h2>
    <p>Enter your API token from api-config.json to connect.</p>
    <input id="token-input" type="password" placeholder="Bearer token" autocomplete="off" />
    <input id="api-url-input" type="text" placeholder="API URL (default: http://localhost:8765)" />
    <button onclick="connect()">Connect</button>
    <span id="setup-error"></span>
  </div>
</div>

<!-- Main UI -->
<div id="main">
  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-tabs">
        <button class="tab-btn active" id="tab-inbox" onclick="switchTab('inbox')">Inbox</button>
        <button class="tab-btn" id="tab-sent" onclick="switchTab('sent')">All</button>
        <button class="tab-btn" id="tab-tasks" onclick="switchTab('tasks')">Tasks</button>
      </div>
      <div class="message-list" id="message-list"></div>
    </div>

    <!-- Detail -->
    <div class="detail" id="detail">
      <div class="empty-state" id="empty-state">Select a message</div>
    </div>
  </div>
</div>

<!-- Compose overlay -->
<div id="compose-overlay">
  <div id="compose-card">
    <h2>New Message</h2>
    <div class="field-row">
      <label>Recipient</label>
      <select id="c-recipient"></select>
    </div>
    <div class="field-row">
      <label>Kind</label>
      <select id="c-kind">
        <option>note</option><option>question</option><option>answer</option>
        <option>ready_for_test</option><option>finding</option>
        <option>fix_ready</option><option>test_result</option>
      </select>
    </div>
    <div class="field-row">
      <label>Subject</label>
      <input id="c-subject" type="text" />
    </div>
    <div class="field-row">
      <label>Commit SHA (required for code/test kinds)</label>
      <input id="c-commit" type="text" placeholder="40-char hex" />
    </div>
    <div class="field-row">
      <label>Body</label>
      <textarea id="c-body" placeholder="Free text, or paste JSON for structured handoffs"></textarea>
    </div>
    <div class="compose-actions">
      <button class="btn-sm" onclick="closeCompose()">Cancel</button>
      <button class="btn-sm btn-primary" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let TOKEN = localStorage.getItem('vb_token') || '';
let API_URL = localStorage.getItem('vb_api_url') || 'http://localhost:8765';
let currentTab = 'inbox';
let messages = [];
let tasks = [];
let selectedId = null;
let agentInfo = null;
const AGENTS = ['developer', 'tester'];
const REPORT_KINDS = new Set(['ready_for_test', 'finding', 'fix_ready', 'test_result']);

// ---------------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------------
async function api(path, opts = {}) {
  const r = await fetch(API_URL + path, {
    headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(err.detail || r.statusText);
  }
  return r.json();
}

// ---------------------------------------------------------------------------
// Connect
// ---------------------------------------------------------------------------
async function connect() {
  const t = document.getElementById('token-input').value.trim();
  const u = document.getElementById('api-url-input').value.trim();
  if (u) { API_URL = u; localStorage.setItem('vb_api_url', u); }
  if (!t) return;
  TOKEN = t;
  try {
    agentInfo = await api('/api/status');
    localStorage.setItem('vb_token', TOKEN);
    document.getElementById('setup').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    const badge = document.getElementById('agent-badge');
    badge.textContent = agentInfo.agent;
    badge.classList.add('connected');
    // populate recipient list minus self
    const sel = document.getElementById('c-recipient');
    sel.innerHTML = AGENTS.filter(a => a !== agentInfo.agent)
      .map(a => `<option value="${a}">${a}</option>`).join('');
    // add compose button to header
    const hdr = document.querySelector('header');
    const btn = document.createElement('button');
    btn.id = 'compose-btn'; btn.className = 'btn-sm btn-primary';
    btn.style.marginLeft = '8px';
    btn.textContent = '+ New';
    btn.onclick = openCompose;
    hdr.appendChild(btn);
    await refresh();
  } catch(e) {
    const el = document.getElementById('setup-error');
    el.textContent = 'Connection failed: ' + e.message;
    el.style.display = 'block';
  }
}

// Auto-connect if token stored
if (TOKEN) {
  document.getElementById('token-input').value = TOKEN;
  document.getElementById('api-url-input').value = API_URL;
  connect();
}

// ---------------------------------------------------------------------------
// Refresh
// ---------------------------------------------------------------------------
async function refresh() {
  if (!TOKEN) return;
  try {
    if (currentTab === 'inbox') await loadInbox();
    else if (currentTab === 'sent') await loadAll();
    else await loadTasks();
    agentInfo = await api('/api/status');
  } catch(e) { console.warn('refresh failed', e); }
}

async function loadInbox() {
  const data = await api('/api/inbox?unread_only=false&limit=20');
  messages = data.messages || [];
  renderMessageList();
}

async function loadAll() {
  const data = await api('/api/inbox?unread_only=false&limit=20');
  messages = data.messages || [];
  renderMessageList();
}

async function loadTasks() {
  const data = await api('/api/tasks?limit=50');
  tasks = data.tasks || [];
  renderTaskList();
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function switchTab(tab) {
  currentTab = tab;
  ['inbox','sent','tasks'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  selectedId = null;
  document.getElementById('detail').innerHTML = '<div class="empty-state" id="empty-state">Select an item</div>';
  refresh();
}

function kindClass(k) { return 'kind-' + (k || 'note'); }

function renderMessageList() {
  const el = document.getElementById('message-list');
  if (!messages.length) { el.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:.82rem">No messages</div>'; return; }
  el.innerHTML = messages.map(m => {
    const unread = !m.acknowledged_at ? ' unread' : '';
    const dot = !m.acknowledged_at ? '<span class="unread-dot"></span>' : '';
    const preview = m.preview || m.body || '';
    const date = new Date(m.created_at).toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="msg-item${unread}${selectedId===m.id?' selected':''}" onclick="selectMessage('${m.id}')">
      <div class="msg-meta">
        ${dot}
        <span class="kind-badge ${kindClass(m.kind)}">${m.kind}</span>
        <span style="font-size:.72rem;color:var(--muted);margin-left:auto">${date}</span>
      </div>
      <div class="msg-subject">${esc(m.subject)}</div>
      <div class="msg-preview">${esc(preview)}</div>
    </div>`;
  }).join('');
}

function renderTaskList() {
  const el = document.getElementById('message-list');
  if (!tasks.length) { el.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:.82rem">No tasks</div>'; return; }
  el.innerHTML = tasks.map(t => `
    <div class="task-item">
      <div class="task-id">${esc(t.task_id)}</div>
      <div class="task-meta">
        <span class="status-badge status-${t.status}">${t.status}</span>
        <span>${t.kind}</span>
        <span>${t.desk_id || ''}</span>
      </div>
      <div style="font-size:.72rem;color:var(--muted);margin-top:3px">${esc(t.commit_sha?.slice(0,12) || '')}</div>
    </div>
  `).join('');
}

// ---------------------------------------------------------------------------
// Message detail
// ---------------------------------------------------------------------------
async function selectMessage(id) {
  selectedId = id;
  renderMessageList();
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const msg = await api('/api/messages/' + id);
    renderDetail(detail, msg);
  } catch(e) {
    detail.innerHTML = `<div class="empty-state" style="color:var(--red)">${esc(e.message)}</div>`;
  }
}

function renderDetail(el, msg) {
  const date = new Date(msg.created_at).toLocaleString();
  const ackDate = msg.acknowledged_at ? new Date(msg.acknowledged_at).toLocaleString() : null;
  const body = msg.body || '';

  // Try structured JSON
  let structured = null;
  try {
    const parsed = JSON.parse(body);
    if (parsed && parsed.protocol) structured = parsed;
  } catch(_) {}

  el.innerHTML = `
    <div class="detail-header">
      <h2>${esc(msg.subject)}</h2>
      <div class="detail-meta">
        <span><span class="kind-badge ${kindClass(msg.kind)}">${msg.kind}</span></span>
        <span>from <b>${msg.sender}</b> → <b>${msg.recipient}</b></span>
        <span>${date}</span>
        ${msg.commit_sha ? `<span class="sha">⎇ ${msg.commit_sha.slice(0,12)}</span>` : ''}
        ${ackDate ? `<span style="color:var(--green)">✓ acked ${ackDate}</span>` : ''}
      </div>
    </div>
    <div class="detail-actions">
      ${!msg.acknowledged_at ? `<button class="btn-sm btn-primary" onclick="ack('${msg.id}')">Acknowledge</button>` : ''}
      <button class="btn-sm" onclick="reply('${msg.id}', '${esc(msg.sender)}')">Reply</button>
      ${msg.thread_id ? `<button class="btn-sm" onclick="loadThread('${msg.thread_id}')">View Thread</button>` : ''}
    </div>
    <div class="detail-body">
      ${structured ? renderStructured(structured) : `<div class="body-text">${esc(body)}</div>`}
    </div>
  `;
}

function renderStructured(data) {
  const verdict = data.verdict || '';
  const findings = (data.findings || []);
  const closed = new Set(data.closed_findings || []);
  return `<div class="body-json">
    <div class="json-section">
      <div class="json-label">Protocol</div>
      <div class="json-value" style="color:var(--muted)">${esc(data.protocol)}</div>
    </div>
    <div class="json-section">
      <div class="json-label">Summary</div>
      <div class="json-value">${esc(data.summary)}</div>
    </div>
    ${data.task_id ? `<div class="json-section">
      <div class="json-label">Task</div>
      <div class="json-value sha">${esc(data.task_id)}${data.desk_id ? ' / ' + esc(data.desk_id) : ''}</div>
    </div>` : ''}
    <div class="json-section">
      <div class="json-label">Verdict</div>
      <div class="json-value verdict-${verdict} " style="font-weight:700">${verdict}</div>
    </div>
    ${findings.length ? `<div class="json-section">
      <div class="json-label">Findings (${findings.length})</div>
      <div>${findings.map(f => `<span class="finding-tag" style="${closed.has(f)?'text-decoration:line-through;opacity:.5':''}">${esc(f)}</span>`).join('')}</div>
    </div>` : ''}
    ${(data.changes||[]).length ? `<div class="json-section">
      <div class="json-label">Changes</div>
      ${data.changes.map(c => `<div class="json-value" style="margin-bottom:4px">
        <span class="sha">${esc(c.path)}</span> · <span style="color:var(--text)">${esc(c.function)}</span>
        ${c.finding_ids.map(f=>`<span class="finding-tag">${esc(f)}</span>`).join('')}
      </div>`).join('')}
    </div>` : ''}
    ${(data.checks||[]).length ? `<div class="json-section">
      <div class="json-label">Checks</div>
      ${data.checks.map(c => `<div class="json-value check-${c.status}" style="margin-bottom:6px">
        ${c.status === 'passed' ? '✓' : c.status === 'failed' ? '✗' : '○'}
        <b>${esc(c.level)}</b> · ${esc(c.scenario_id)}
        ${c.limitations?.length ? `<span style="color:var(--yellow);font-size:.75rem"> ⚠ ${c.limitations.join('; ')}</span>` : ''}
        ${c.evidence?.length ? `<div style="font-size:.72rem;color:var(--muted);padding-left:16px">${c.evidence.map(esc).join('<br/>')}</div>` : ''}
      </div>`).join('')}
    </div>` : ''}
    ${(data.remaining||[]).length ? `<div class="json-section">
      <div class="json-label">Remaining Scope</div>
      ${data.remaining.map(r=>`<div class="json-value" style="color:var(--yellow);font-size:.8rem">• ${esc(r)}</div>`).join('')}
    </div>` : ''}
    ${data.next_owner ? `<div class="json-section">
      <div class="json-label">Next Owner</div>
      <div class="json-value" style="color:var(--accent)">${esc(data.next_owner)}</div>
    </div>` : ''}
  </div>`;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
async function ack(id) {
  try {
    await api('/api/messages/' + id + '/acknowledge', { method: 'POST' });
    await selectMessage(id);
    await loadInbox();
  } catch(e) { alert('Failed: ' + e.message); }
}

let replyToId = null;
function reply(id, sender) {
  replyToId = id;
  openCompose();
  const sel = document.getElementById('c-recipient');
  for (let i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === sender) { sel.selectedIndex = i; break; }
  }
  document.getElementById('c-kind').value = 'answer';
}

async function loadThread(threadId) {
  const data = await api('/api/threads/' + threadId);
  const msgs = data.messages || [];
  const list = document.getElementById('message-list');
  list.innerHTML = `<div style="padding:8px 14px;font-size:.72rem;color:var(--accent)">Thread (${msgs.length})</div>` +
    msgs.map(m => {
      const date = new Date(m.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
      return `<div class="msg-item${selectedId===m.id?' selected':''}" onclick="selectMessage('${m.id}')">
        <div class="msg-meta"><span class="kind-badge ${kindClass(m.kind)}">${m.kind}</span>
          <span style="font-size:.72rem;color:var(--muted);margin-left:auto">${date}</span></div>
        <div class="msg-subject">${esc(m.subject)}</div></div>`;
    }).join('');
}

// ---------------------------------------------------------------------------
// Compose
// ---------------------------------------------------------------------------
function openCompose() { document.getElementById('compose-overlay').classList.add('open'); }
function closeCompose() {
  document.getElementById('compose-overlay').classList.remove('open');
  replyToId = null;
  ['c-subject','c-commit','c-body'].forEach(id => document.getElementById(id).value = '');
}

async function sendMessage() {
  const recipient = document.getElementById('c-recipient').value;
  const kind = document.getElementById('c-kind').value;
  const subject = document.getElementById('c-subject').value.trim();
  const commit_sha = document.getElementById('c-commit').value.trim();
  const body = document.getElementById('c-body').value;
  if (!recipient || !subject || !body) { alert('Recipient, subject and body are required.'); return; }
  const idempotency_key = 'ui-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  try {
    await api('/api/messages', {
      method: 'POST',
      body: JSON.stringify({ recipient, kind, subject, body, idempotency_key, commit_sha,
                             reply_to: replyToId || '' }),
    });
    closeCompose();
    await refresh();
  } catch(e) { alert('Send failed: ' + e.message); }
}

// ---------------------------------------------------------------------------
// Utils
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auto-refresh every 30s
setInterval(() => { if (TOKEN) refresh(); }, 30000);
</script>
